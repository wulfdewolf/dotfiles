# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    grace = 1
    hide_cursor = true
}

# No background block at all = solid transparent backdrop

input-field {
    size = 240, 45
    position = 0, -50

    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(255, 255, 255)

    fade_on_empty = true
    placeholder_text = Password
}

label {
    text = $TIME
    font_size = 64
    position = 0, 80
    color = rgba(255, 255, 255, 0.8)
}

label {
    text = cmd[update:1000] date +"%a %d %b"
    font_size = 18
    position = 0, 30
    color = rgba(255, 255, 255, 0.5)
}
